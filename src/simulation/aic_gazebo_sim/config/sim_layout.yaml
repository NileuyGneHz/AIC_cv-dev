# 仿真场景几何 —— M4：对齐 VirtualNext Smart 官方平台（流程反转版）
#
# 演进（依据 docs/vnext_pdf/manual.txt + 官方整机效果图）：
#   M2：货架 12 库位「取料」 -> 4 个码放格「堆叠」；
#   M3：置物台「上料」 -> 相机识别 -> 吸盘「取料」 -> 货架 4 列 x 3 层「放入」。
#        货架是放置目标，每格有且只有一块（官方摆放要求 2.2.2），不放第三块；
#   M4：来料改为「3 行 x 4 列来料架」——12 块物料开局就按格铺在架上（类型乱序），
#        逐块传送到置物台识别，再放进分拣货架对应类型列。
#
# 坐标系：world frame 名 = warehouse（与 MaterialTask.header.frame_id 一致）
#   +X = 操作者视角的「右」（4 列方向）
#   +Y = 操作者视角的「远」（货架在 +Y 侧）
#   +Z = 上
#
# 消费方：
#   scripts/gen_world.py         生成 worlds/aic_warehouse.sdf（底板/货架/置物台/供料管/12 块物料/龙门）
#   scripts/gantry_controller.py 轮次逻辑：GOTO=去置物台，HANDLE=取料+放货架
#   scripts/sim_vision_node.py   真值桩：按 GOTO 计数回型
# 改动这里后：重跑 scripts/gen_world.py，再重启仿真。

frame_id: warehouse

# 放置货架（对齐官方「智能感知货架」的立面）：4 列（对应四类缺陷）x 3 行，每格一块
#   列 = 类型：xs 顺序即类型 1/2/3/4；行沿 +Z 叠高，**三行同一深度（垂直立面）**。
#   因为三行共面，吸盘不能从正上方垂直下放（会穿过上层托盘），
#   放置动作改为「前排定位 -> 平推进格 -> 落座 -> 退出」，
#   见 gantry_controller._handle_steps 里的 place 段。
rack:
  cols: 4             # 类型列数
  rows: 3             # 每列行数（层高 top_z + (row-1)*level_pitch_z）
  pitch_x: 0.25       # m，列间距
  level_pitch_z: 0.06 # m，行间距（层高 = top_z + (row-1) * level_pitch_z）
  y_front: 0.31       # m，三行共用的深度线（立面）
  level_step_y: 0.0   # m，行间 y 错位；0 = 垂直立面（官方形态）。
                      # >0 时退化成阶梯架（旧 M4 形态，吸盘可垂直下放）。
  top_z: 0.10         # m，第 1 行托盘面上表面（与置物台同高）
  tile_size: 0.12     # m，格口边长
  rim_height: 0.012   # m，格口围边（防滑出；不堆叠所以不需要更高）

plate:
  diameter: 0.08       # m，圆形物料直径
  thickness: 0.006
  mass: 0.05

materials:
  # 物料生成顺序即类型真值：第 k 个 GOTO 生成的 material_k 类型 = types[k-1]。
  # gt 桩与判分都用这一份事实。1=划痕 2=污渍 3=缺角 4=孔洞（官方四类：
  # 划痕/污渍/孔洞/破损，破损即缺角）。
  types: [1, 3, 2, 4, 2, 1, 4, 3, 3, 1, 2, 4]
  # 缺陷几何随机化：0 = 关闭（生成物与基线逐字节一致）；>0 = 按 (seed, index) 抽几何。
  jitter_seed: 0

gantry:
  travel_z: 0.02       # 行进高度（关节值；吸口下沿 = pad_z0 + travel_z = 0.259，
                       # 比第 3 层围边顶 0.232 高 27 mm —— 携料平移必须跨过货架最高点）
  xy_speed: 0.30
  z_speed: 0.20
  handle_dwell_s: 0.35
  pos_tol: 0.003
  vel_tol: 0.010
  move_timeout_s: 8.0
  # 吸盘工具基准：z_joint=0 时吸盘吸口下沿的世界高度（与 model.sdf 一致）。
  # 目标「贴住盘顶」的关节值 = 盘顶高度 - pad_z0。
  pad_z0: 0.239

# 末端相机（M3 改为固定式，对齐官方：拍照在前、下探在后，吸盘不进光路）：
#   装在置物台正上方，朝下，盘顶距离 ~0.26 m（盘半径 ~83 px，与 M2 标定一致）。
#   GOTO 停在置物台 + goto_offset_y 偏移位（吸盘让出光路），识别通过后 HANDLE
#   再平移到置物台正上下探吸取。
camera:
  width: 640
  height: 480
  fov_h: 1.047
  update_rate: 20.0
  mount: [0.30, -0.15, 0.366, 0.0, 1.5708, -1.5708]   # x y z r p y（相对世界）

# 置物台（取料源）：每轮生成一块物料于此，相机俯拍识别后吸盘取走
staging:
  x: 0.30
  y: -0.15
  z: 0.10              # m，台面上表面（盘落面）
  goto_offset_y: 0.10  # m，GOTO 停靠点相对置物台的 +Y 偏移（吸盘让出相机光路；
                       # 需 > 吸盘半宽 + 盘半径的一半，且在相机视场半径 ~0.15 m 内）

# 停料区（M5，对齐官方「生成物料」）：12 块物料开局停在**底板下方**的托板上
# （俯视完全看不见），每轮由 gantry_controller 用 set_pose 送到置物台。
#
# 为什么不运行时 create：DetachableJoint 插件在世界加载时解析 child_model，
# 动态创建的实体绑不上（M2 实测插件直接失效、吸附无效）。所以 12 块仍在 SDF 里，
# 只是藏在底板下面，看起来等价于「点一下生成一块」。
park:
  x0: -0.495         # m，第 1 块的 x（12 块沿 +X 排开，落在 1.40 m 底板内）
  pitch_x: 0.09      # m，块间距（盘径 0.08，留 10 mm）
  y: 0.0
  z: -0.10           # m，停料托板面（在底板 z 0..0.02 之下）

# 回收位：上一轮「识别失败未取走」的物料在下一轮 GOTO 时被传送到这里
recycle:
  x: -0.10
  y: -0.15
  z: 0.02              # m，底板上表面

# 自由摄像机（scene_cam，看板页面的「全景/自由视角」数据源）
scene_cam:
  pose: [0.0, 0.02, 1.62, 0.0, 1.5708, 1.5708]   # 正俯视：同时看到来料架与分拣货架全貌
  fov_h: 1.30
  width: 960
  height: 540
  update_rate: 15.0

# 库位监视相机（每个格口一只，隐藏、无实体外观）
#   货架是垂直立面，层间距 0.06 m —— 正上方会被上一层托盘挡住，
#   所以相机装在「格口前沿外 y_offset、托盘面上方 z_lift」，俯视格心。
#   160x120 / 5 Hz 只做占位监视；识别仍走置物台正上方的 ee_cam。
rack_cams:
  fov_h: 1.25
  width: 128
  height: 96
  update_rate: 3.0
  z_lift: 0.040        # m，相对本层托盘面
  y_offset: 0.115      # m，在格口前沿外（朝 -Y）
