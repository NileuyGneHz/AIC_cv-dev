# 仿真场景几何（与决策侧 aic_warehouse/config/warehouse_layout.yaml 编号口径一致）
#
# 坐标系：world frame 名 = warehouse（与 MaterialTask.header.frame_id 一致）
#   +X = 操作者视角的「右」（4 列方向）
#   +Y = 操作者视角的「远」（3 行方向，row 1 在前排 / -Y）
#   +Z = 上
#   slot_id = (row-1)*cols + col（row-major，决策侧同一口径）
#
# 本文件同时被三个消费方读取：
#   scripts/gen_world.py        生成 worlds/aic_warehouse.sdf 的库位地贴
#   scripts/gantry_controller.py 库位号 -> 龙门关节坐标
#   scripts/spawn_materials.py   12 块物料的落位
# 改动这里后：重跑 scripts/gen_world.py，再重启仿真。

frame_id: warehouse

rack:
  cols: 4
  rows: 3
  pitch_x: 0.25        # m，列间距（4 列跨 1.0 m）
  pitch_y: 0.1667      # m，行间距（3 行跨 0.5 m）
  center_x: 0.0        # m，货架中心（世界坐标）
  center_y: 0.0
  top_z: 0.10          # m，台面板上表面高度
  tile_size: 0.115     # m，库位地贴边长（仅视觉，便于相机定位）
  tile_thickness: 0.003

plate:
  diameter: 0.08       # m，圆形铁片直径
  thickness: 0.006
  # 落位：直接贴台面板上表面（地贴只有 visual，不参与碰撞），底面 z = rack.top_z

materials:
  # 12 个库位的缺陷类型（按 slot_id=1..12 顺序；1=划痕 2=污渍 3=缺角 4=孔洞）
  # gen_world.py 按此把铁片烘进 world，sim_vision_node 按此发 ground truth。
  # 改类型分配：改这一行 -> 重跑 scripts/gen_world.py -> 重启仿真。
  types: [1, 3, 2, 4, 2, 1, 4, 3, 3, 1, 2, 4]
  # 缺陷几何随机化：0 = 关闭（M2 的固定几何，生成物逐字节不变）；
  # >0 = 按该种子给每块铁片抽「朝向 / 盘内位置 / 尺寸」（范围见 gen_world.py 的 JITTER）。
  # 同一 seed 可复现；做鲁棒性回归时逐种子生成世界再跑一轮。
  # 只随机几何，不改类型 —— 类型仍由 materials.types 决定，视觉真值不受影响。
  jitter_seed: 0

gantry:
  # 龙门关节零位 = 相机位于货架中心正上方、末端在最上位
  travel_z: 0.0        # 行进高度（关节值，0 = 最上）
  pick_z: -0.04        # 抓取高度（关节值，负 = 下降；夹指底面到 0.095 m）
  xy_speed: 0.30       # 水平速度 m/s（关节速度上限 0.35，留一点余量）
  z_speed: 0.20        # 升降速度 m/s（HANDLE 每个位点要上下各一次，太慢会拖垮节拍）
  handle_dwell_s: 0.35 # 抓取停留时间（夹爪动作占位）
  pos_tol: 0.003       # 到位判定阈值：位置误差 m
  vel_tol: 0.010       # 到位判定阈值：残余速度 m/s（必须与 pos_tol 一起判，
                       # 只判位置会把「慢速爬行中恰好穿过阈值」当成到位）
  move_timeout_s: 8.0  # 单段运动超时（超时按到位处理，仅告警）

camera:
  width: 640
  height: 480
  fov_h: 1.047         # rad ≈ 60°
  update_rate: 20.0    # Hz
  # 相机在 z_carriage 内的安装高度（关节零位时相机在 0.545+mount_z，台面 0.10）：
  #   mount_z=-0.18 → 距盘面约 0.26 m，盘半径 ~83 px（标称，阈值在这里整定）
  #   -0.13 = 相机更高（距盘面 0.31 m，r≈72 px）；-0.23 = 更低（0.21 m，r≈106 px）
  #   用来验证「按盘半径归一化」的判据是否真的与尺度无关。改完要重生成世界。
  mount_z: -0.18

# 分类码放区（4 格，按缺陷类型 1..4 沿 +X 排列）
#
# 为什么在 +Y 侧另起一条：真机台面 1000x500 已被 12 库位占满，龙门行程也只有
# y∈[-0.24, 0.32]，台面上确实挤不下 4 个格子。仿真为了把「识别 -> 抓取 -> 搬运 ->
# 按类型释放」整条动作跑通，在货架后沿接了一条 120 mm 深的码放条（台面总深变 640 mm）。
# 真机布置不同时只改这里：坐标是唯一数据源，控制器与生成器都读它。
place_zones:
  y: 0.30              # m，码放条中心线（世界坐标）
  z: 0.10              # m，台面上表面（与 rack.top_z 同高）
  tile_size: 0.12      # m，每格地贴边长
  rim_height: 0.012    # m，格口围边高度（防止放下后滑出）
  xs: [-0.36, -0.12, 0.12, 0.36]   # 类型 1/2/3/4 的格心 x
  # 放下时 Z 用 gantry.pick_z：抓取点与放置点同高，铁片底面正好落到台面。

# 自由摄像机（scene_cam，看板页面的「全景/自由视角」数据源）
#   pose = [x y z roll pitch yaw]（默认机位：货架正前上方全景俯视）；
#   运行时可经 /world/aic_warehouse/set_pose 服务移动（看板相机按钮），改这里只是改初始机位。
#   改动后需重跑 gen_world.py 并重启仿真。
scene_cam:
  pose: [0.0, -0.95, 1.15, 0.0, 0.88, 1.5708]
  fov_h: 1.30          # rad，水平视场
  width: 960
  height: 540
  update_rate: 15.0    # Hz
