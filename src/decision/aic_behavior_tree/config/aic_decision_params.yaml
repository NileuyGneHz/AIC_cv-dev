# 决策节点参数（ros2 run/launch 时用 --params-file 加载）
# 说明：话题与超时都在这里改，不用碰代码；XML 里用 {vision_timeout} 之类的黑板变量引用。
aic_decision_bt:
  ros__parameters:
    # 空 = 用包内默认：aic_behavior_tree/share/config/trees/aic_sort.xml
    tree_xml: ""
    # 空 = 用 aic_warehouse/share/config/warehouse_layout.yaml
    warehouse_yaml: ""

    # ---- vision 侧契约（见 docs/guides/decision_vision_interface.md）----
    vision_topic: "/vision/material_type"      # std_msgs/String，取值 "1".."4"
    vision_timeout_s: 3.0                      # 单个位点等待识别结果的超时
    vision_trigger_enable: false               # 是否主动请求 vision 采集（与 vision 组待定，默认关）
    vision_trigger_topic: "/vision/trigger"    # 仅当上面的开关为 true 时使用；与 gantry/vision 同一条话题

    # ---- control 侧契约（见 docs/guides/decision_control_interface.md）----
    control_task_topic: "/control/material_task"   # aic_msgs/MaterialTask
    control_wait_ready: false                      # control 就绪握手，留白，默认关
    control_ready_topic: "/control/ready"          # std_msgs/Bool

    # ---- 运行行为 ----
    results_csv: ""        # 非空则逐位点写 CSV（建议 logs/run_YYYYmmdd_HHMMSS.csv）
    tick_rate_hz: 50.0     # 行为树推进频率
    once: false            # true = 跑完一轮即退出（自验用）
    auto_restart: false    # true = 一轮结束后自动重开巡视
